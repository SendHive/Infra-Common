name: Test on Merge to Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-infra-common:
    name: Run Infrastructure Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mydatabase
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          server /data --console-address ":9001"
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          go install github.com/jstemmer/go-junit-report@latest

      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432 -U user; do echo "Waiting for PostgreSQL..."; sleep 2; done
          until curl -f http://localhost:9000/minio/health/live; do echo "Waiting for Minio..."; sleep 2; done
          until redis-cli -h localhost -p 6379 ping | grep PONG; do echo "Waiting for Redis..."; sleep 2; done
          until rabbitmq-diagnostics -q -h localhost -p 5672 ping; do echo "Waiting for RabbitMQ..."; sleep 2; done

      - name: Run test suite
        run: go test ./...
        env:
          CI: true
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: user
          DB_PASSWORD: password
          DB_NAME: mydatabase
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          REDIS_ADDR: localhost:6379
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
          RABBITMQ_USER: guest
          RABBITMQ_PASSWORD: guest
          RABBITMQ_VHOST: "/"
